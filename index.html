<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ソート</title>

<style>

body{
    font-family:sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
    background:#f7f7f7;
}

h1,
h2{
    text-align:center;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
    width:100%;
    padding:16px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.primary{
    background:#4a79ff;
    color:white;
}

.choice{
    background:white;
    border:2px solid #4a79ff;
    color:#333;
}

.choice:hover{
    background:#eef3ff;
}

.draw{
    background:#f3f3f3;
    border:2px solid #aaa;
    color:#333;
}

.draw:hover{
    background:#e9e9e9;
}

.secondary{
    background:#f3f3f3;
    border:2px solid #aaa;
    color:#333;
}

button:disabled{
    opacity:.45;
    cursor:default;
}



.rank-row{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.progress{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}



.vs{
    text-align:center;
    margin:15px 0;
    font-weight:bold;
}

.result-rank{
    display:inline-block;
    width:50px;
    font-weight:bold;
}

.result-name{
    font-size:18px;
}

/* =========================================
   結果画面
========================================= */

.result-card .rank-row{
    display:flex;
    align-items:center;
    min-height:40px;
    box-sizing:border-box;
}

.result-card .result-name{
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* iPhoneなど幅の小さい画面では
   トップ10がなるべく1画面に収まるようにする */
@media (max-width:430px){

    body{
        padding:10px;
    }

    .result-card{
        padding:12px;
        margin-bottom:10px;
    }

    .result-card h2{
        margin:4px 0 10px;
        font-size:22px;
    }

    .result-card .rank-row{
        min-height:34px;
        padding:6px 4px;
    }

    .result-card .result-rank{
        width:42px;
        font-size:15px;
    }

    .result-card .result-name{
        font-size:15px;
    }

    .result-card button{
        padding:12px;
        font-size:16px;
        margin-top:8px;
    }
}


/* =========================================
   選択ボタン
========================================= */

.select-button{
    display:block;
    position:relative;

    width:100%;
    box-sizing:border-box;

    padding:15px 18px;
    margin:10px 0;

    background:#fff;
    border:2px solid #ddd;
    border-radius:10px;

    font-size:18px;
    text-align:center;
    cursor:pointer;

    transition:
        background .15s,
        border-color .15s,
        color .15s;
}


/* 本物のチェックボックスは隠す */
.select-button input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}


/* 選択中 */
.select-button:has(input:checked){
    background:#6699ff;
    border-color:#6699ff;
    color:white;
}



/* タップ時 */
.select-button:active{
    transform:scale(.98);
}

</style>

</head>

<body>

<div id="app"></div>

<script src="talents.js"></script>

<script>

/* =========================================
   設定
========================================= */

const DATA = talents;

const PAGE_SIZE = 8;

/*
 * 1人あたり平均5試合
 */
const TARGET_GAMES_PER_PLAYER = 5;

/*
 * レート差300未満を優先
 */
const MAX_RATING_DIFFERENCE = 300;

/*
 * Eloの変動係数
 */
const K_FACTOR = 32;


/* =========================================
   状態
========================================= */

let candidates = [];

let qualifyIndex = 0;

let survivors = [];

let currentPageItems = [];

/*
 * 予選で選択した候補の番号
 * ページを戻っても選択状態を保持する
 */
let selectedCandidateIndices = new Set();

let battleCount = 0;

let maxBattle = 0;

let left = null;

let right = null;

/*
 * 対戦済み組み合わせ
 */
let playedMatches = new Set();

/*
 * 個人ソート / コンビソート
 */
let currentMode = null;

/*
 * 結果を全部表示しているか
 */
let showingAllResults = false;

/*
 * 第2ラウンド
 */
let currentRound = 1;
let finalRoundPairs = [];
let finalRoundIndex = 0;

/*
 * 第1ラウンド終了時の順位を保存
 * 13位以降はこの順位を使う
 */
let firstRoundRanking = [];

/*
 * 全体の進捗用
 */
let firstRoundMaxBattle = 0;
let totalBattleCount = 0;


/* =========================================
   予選のチェック状態変更
========================================= */

document
    .getElementById("app")
    .addEventListener("change", function(event){

        if(
            event.target.matches(
                '#qualifyList input[type="checkbox"]'
            )
        ){
            updateQualifySelection();
        }

    });


/* =========================================
   アプリ全体のクリック処理
========================================= */

document
    .getElementById("app")
    .addEventListener("click", function(event){

        const target =
            event.target.closest("button");

        if(!target){
            return;
        }


        /* ---------------------------------
           個人 / コンビ選択後
           ソート方法選択
        --------------------------------- */

        if(
            target.id ===
            "allSortButton"
        ){

            startAllSort();

            return;
        }


        if(
            target.id ===
            "selectSortButton"
        ){

            startSelectSort();

            return;
        }


        /* ---------------------------------
           予選「次へ」
        --------------------------------- */

        if(
            target.id ===
            "nextQualifyButton"
        ){

            nextQualify();

            return;
        }


        /* ---------------------------------
           予選「戻る」
        --------------------------------- */

        if(
            target.id ===
            "backQualifyButton"
        ){

            previousQualify();

            return;
        }


        /* ---------------------------------
           スタート画面
        --------------------------------- */

        if(
            target.id ===
            "personsButton"
        ){

            startSort("persons");

            return;
        }


        if(
            target.id ===
            "unitsButton"
        ){

            startSort("units");

            return;
        }


        /* ---------------------------------
           本戦 左
        --------------------------------- */

        if(
            target.id ===
            "leftButton"
        ){

            vote("left");

            return;
        }


        /* ---------------------------------
           本戦 右
        --------------------------------- */

        if(
            target.id ===
            "rightButton"
        ){

            vote("right");

            return;
        }


        /* ---------------------------------
           本戦 引き分け
        --------------------------------- */

        if(
            target.id ===
            "drawButton"
        ){

            vote("draw");

            return;
        }


        /* ---------------------------------
           結果：全部表示
        --------------------------------- */

        if(
            target.id ===
            "showAllButton"
        ){

            showingAllResults = true;

            showResult();

            return;
        }


        /* ---------------------------------
           結果：トップ10に戻す
        --------------------------------- */

        if(
            target.id ===
            "showTop10Button"
        ){

            showingAllResults = false;

            showResult();

            return;
        }


        /* ---------------------------------
           結果 → 最初に戻る
        --------------------------------- */

        if(
            target.id ===
            "restartButton"
        ){

            showStart();

            return;
        }

    });


/* =========================================
   スタート画面
========================================= */

function showStart(){

    document.getElementById("app").innerHTML = `

    <div class="card">

        <h2>よしもと劇場所属芸人ソート</h2>
        対象を選んでください（複数選択可）

<label class="select-button">
    <input
        type="checkbox"
        value="tokyo_kakeru"
    >
    東京翔
</label>

<label class="select-button">
    <input
        type="checkbox"
        value="tokyo_kiwami"
    >
    東京極
</label>

<label class="select-button">
    <input
        type="checkbox"
        value="osaka_kakeru"
    >
    大阪翔
</label>

<label class="select-button">
    <input
        type="checkbox"
        value="osaka_kiwami"
    >
    大阪極
</label>

<br>
        <button
            id="personsButton"
            class="primary"
        >
            個人ソート
        </button>


        <button
            id="unitsButton"
            class="primary"
        >
            コンビソート
        </button>

    </div>

    `;

}


/* =========================================
   ソート開始
========================================= */

function startSort(mode){

    const checked = [
        ...document.querySelectorAll(
            'input[type="checkbox"]:checked'
        )
    ].map(
        x => x.value
    );


    if(checked.length === 0){

        alert(
            "分類を1つ以上選んでください"
        );

        return;
    }


    candidates =
        DATA[mode].filter(
            item =>
                checked.includes(
                    item.group
                )
        );


    if(candidates.length === 0){

        alert(
            "該当する対象がありません"
        );

        return;
    }


    /*
     * 現在のソート方式を保存
     */

    currentMode = mode;


    /*
     * ソート方法選択画面へ
     */

    showSortMethodChoice();

}


/* =========================================
   ソート方法選択
========================================= */

function showSortMethodChoice(){

    document.getElementById("app").innerHTML = `

    <div class="card">

        <h2>ソート方法</h2>

        <div class="progress">
            対象：
            ${candidates.length} 組
            /人
        </div>


        <button
            type="button"
            id="allSortButton"
            class="primary"
        >
            全員でソートをする
        </button>


        <button
            type="button"
            id="selectSortButton"
            class="secondary"
        >
            ソート対象を選ぶ
        </button>

    </div>

    `;

}


/* =========================================
   全員でソート
========================================= */

function startAllSort(){

    /*
     * 予選を完全にスキップ
     *
     * candidates全員を
     * 本戦参加者にする
     */

    survivors =
        candidates.map(
            item => ({

                ...item,

                rating: 1500,

                games: 0,

                wins: 0,

                losses: 0,

                draws: 0

            })
        );


    currentPageItems = [];

    qualifyIndex = 0;


    if(
        survivors.length < 2
    ){

        alert(
            "本戦に進む対象が足りません"
        );

        showStart();

        return;
    }


    startBattle();

}


/* =========================================
   ソート対象を選ぶ
========================================= */

function startSelectSort(){

    qualifyIndex = 0;

    survivors = [];

    currentPageItems = [];

    selectedCandidateIndices = new Set();


    showQualifyPage();

}


/* =========================================
   予選画面
========================================= */

function showQualifyPage(){

    /*
     * 全ページ終了
     */

    if(
        qualifyIndex >=
        candidates.length
    ){

        /*
         * ページ移動があっても重複しないよう、
         * 最後に選択状態から本戦参加者を作る
         */
        survivors =
            [...selectedCandidateIndices]
            .sort((a,b) => a - b)
            .map(index => candidates[index])
            .filter(Boolean)
            .map(item => ({

                ...item,

                rating: 1500,
                games: 0,
                wins: 0,
                losses: 0,
                draws: 0

            }));


        if(
            survivors.length < 2
        ){

            alert(
                "本戦に進む対象が足りません"
            );

            showStart();

            return;
        }


        startBattle();

        return;
    }


    /*
     * 今回表示する8人
     */

    currentPageItems =
        candidates.slice(
            qualifyIndex,
            qualifyIndex + PAGE_SIZE
        );


    const currentPage =
        Math.floor(
            qualifyIndex / PAGE_SIZE
        ) + 1;


    const totalPages =
        Math.ceil(
            candidates.length / PAGE_SIZE
        );


    let html = `

    <div class="card">

        <h2>ソート対象</h2>

        <div class="progress">
            ${currentPage} / ${totalPages}
        </div>

        <div class="progress">
            ソートする対象を選んでください
        </div>

        <div class="progress" id="qualifyCount">
            選択中：${selectedCandidateIndices.size}${currentMode === "persons" ? "人" : "組"}
        </div>


        <div id="qualifyList">
    `;


    currentPageItems.forEach(
        (item,index) => {

html += `

<label class="select-button">

    <input
        type="checkbox"
        value="${index}"
        ${selectedCandidateIndices.has(qualifyIndex + index) ? "checked" : ""}
    >

    ${item.name}
    ${item.unit}

</label>

`;

        }
    );


    html += `

        </div>


        <button
            type="button"
            id="nextQualifyButton"
            class="primary"
        >
            次へ
        </button>

        <button
            type="button"
            id="backQualifyButton"
            class="secondary"
            ${qualifyIndex === 0 ? "disabled" : ""}
        >
            戻る
        </button>

    </div>

    `;


    document.getElementById(
        "app"
    ).innerHTML = html;

}


/* =========================================
   予選「次へ」
========================================= */

function updateQualifySelection(){

    const pageStart = qualifyIndex;

    /*
     * 現在のページ分だけいったん削除
     */
    currentPageItems.forEach((item,index) => {

        selectedCandidateIndices.delete(
            pageStart + index
        );

    });


    const checked =
        document.querySelectorAll(
            '#qualifyList input[type="checkbox"]:checked'
        );


    [...checked].forEach(input => {

        selectedCandidateIndices.add(
            pageStart + Number(input.value)
        );

    });


    const countElement =
        document.getElementById("qualifyCount");

    if(countElement){

        countElement.textContent =
            `選択中：${selectedCandidateIndices.size}${currentMode === "persons" ? "人" : "組"}`;

    }

}


/* =========================================
   予選「次へ」
========================================= */

function nextQualify(){

    /*
     * 次へを押した時点の選択状態を保存
     */
    updateQualifySelection();

    qualifyIndex += PAGE_SIZE;

    showQualifyPage();

}


/* =========================================
   予選「戻る」
========================================= */

function previousQualify(){

    /*
     * 現在ページの変更も保存してから1ページ戻る
     */
    updateQualifySelection();

    if(qualifyIndex === 0){
        return;
    }

    qualifyIndex -= PAGE_SIZE;

    if(qualifyIndex < 0){
        qualifyIndex = 0;
    }

    showQualifyPage();

}


/* =========================================
   Elo計算
========================================= */

function expectedScore(
    ratingA,
    ratingB
){

    return 1 / (
        1 +
        Math.pow(
            10,
            (ratingB - ratingA) / 400
        )
    );

}


/* =========================================
   対戦組み合わせキー
========================================= */

function getMatchKey(
    playerA,
    playerB
){

    const keyA =
        playerA.name +
        "__" +
        playerA.unit;


    const keyB =
        playerB.name +
        "__" +
        playerB.unit;


    return [
        keyA,
        keyB
    ]
    .sort()
    .join("|||");

}


/* =========================================
   本戦開始
========================================= */

function startBattle(){

    currentRound = 1;

    battleCount = 0;


    /*
     * 対戦履歴をリセット
     */

    playedMatches.clear();


    /*
     * 全員1500スタート
     */

    survivors.forEach(
        player => {

            player.rating = 1500;

            player.games = 0;

            player.wins = 0;

            player.losses = 0;

            player.draws = 0;

        }
    );


    /*
     * 1人あたり平均5試合
     *
     * 1試合 = 2人なので ÷2
     */

    firstRoundMaxBattle =
        Math.ceil(
            survivors.length *
            TARGET_GAMES_PER_PLAYER /
            2
        );

    /*
     * 第2ラウンド分は、上位12人なら66試合
     * （実際の人数が12人未満ならその人数で計算）
     */
    const finalPlayerCount =
        Math.min(
            12,
            survivors.length
        );

    const finalBattleCount =
        finalPlayerCount *
        (finalPlayerCount - 1) /
        2;

    totalBattleCount =
        firstRoundMaxBattle +
        finalBattleCount;

    maxBattle =
        totalBattleCount;

    showingAllResults = false;


    battleNext();

}


/* =========================================
   次の対戦
========================================= */

function battleNext(){

    /*
     * 第2ラウンドは総当たり専用
     */
    if(currentRound === 2){

        finalBattleNext();

        return;
    }


    /*
     * 規定試合数に到達
     */

    /*
     * 第1ラウンドの規定試合数に到達
     */
    if(
        currentRound === 1 &&
        battleCount >=
        firstRoundMaxBattle
    ){

        /*
         * 上位12人で第2ラウンドへ
         */
        startFinalRound();

        return;
    }


    /*
     * 試合数が一番少ない人を優先
     */

    const minimumGames =
        Math.min(
            ...survivors.map(
                player =>
                    player.games
            )
        );


    const leftCandidates =
        survivors
            .map(
                (player,index) => ({
                    player,
                    index
                })
            )
            .filter(
                item =>
                    item.player.games ===
                    minimumGames
            );


    const selected =
        leftCandidates[
            Math.floor(
                Math.random() *
                leftCandidates.length
            )
        ];


    left =
        selected.index;


    /*
     * 対戦相手を探す
     */

    right =
        findOpponent();


    /*
     * 未対戦相手がもういない
     */

    if(
        right === -1 ||
        right === null
    ){

        /*
         * 第1ラウンドが予定より早く終了しても
         * 第2ラウンドへ進む
         */
        startFinalRound();

        return;
    }


    const leftPlayer =
        survivors[left];

    const rightPlayer =
        survivors[right];


    /*
     * 本戦画面
     */

    document.getElementById(
        "app"
    ).innerHTML = `

    <div class="card">

        <h2>どちらかを選んでください</h2>

        <div class="progress">
            ${battleCount + 1}
            /
            ${totalBattleCount}
        </div>


        <button
            type="button"
            id="leftButton"
            class="choice"
        >
            ${leftPlayer.name}
            ${leftPlayer.unit}
        </button>


        <div class="vs">
            VS
        </div>


        <button
            type="button"
            id="rightButton"
            class="choice"
        >
            ${rightPlayer.name}
            ${rightPlayer.unit}
        </button>


        <button
            type="button"
            id="drawButton"
            class="draw"
        >
            引き分け
        </button>

    </div>

    `;

}


/* =========================================
   第2ラウンド開始
   上位12人（12人未満なら全員）で総当たり
========================================= */

function startFinalRound(){

    /*
     * 第1ラウンドの順位を保存
     * 13位以降の最終結果に使用する
     */
    firstRoundRanking =
        [...survivors]
        .sort(
            (a,b) =>
                b.rating -
                a.rating
        );


    /*
     * 第1ラウンド上位12人だけを
     * 第2ラウンドへ進める
     */
    survivors =
        firstRoundRanking
        .slice(0,12);


    /*
     * 第2ラウンドは全員1500から再スタート
     */
    survivors.forEach(
        player => {

            player.rating = 1500;

            player.games = 0;

            player.wins = 0;

            player.losses = 0;

            player.draws = 0;

        }
    );


    currentRound = 2;

    finalRoundIndex = 0;

    playedMatches.clear();


    /*
     * 全組み合わせを作る
     *
     * 12人なら66試合
     */
    finalRoundPairs = [];

    for(
        let i = 0;
        i < survivors.length;
        i++
    ){

        for(
            let j = i + 1;
            j < survivors.length;
            j++
        ){

            finalRoundPairs.push({
                left: i,
                right: j
            });

        }

    }


    /*
     * 総当たりの組み合わせ自体は全て残しつつ、
     * 対戦順をランダムにする
     */
    for(
        let i = finalRoundPairs.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            finalRoundPairs[i],
            finalRoundPairs[j]
        ] = [
            finalRoundPairs[j],
            finalRoundPairs[i]
        ];

    }


    totalBattleCount =
        firstRoundMaxBattle +
        finalRoundPairs.length;

    maxBattle =
        totalBattleCount;


    showingAllResults = false;


    /*
     * 第2ラウンド開始
     */
    battleNext();

}


/* =========================================
   第2ラウンド：次の対戦
========================================= */

function finalBattleNext(){

    /*
     * 全試合終了
     */
    if(
        finalRoundIndex >=
        finalRoundPairs.length
    ){

        showResult();

        return;
    }


    const pair =
        finalRoundPairs[
            finalRoundIndex
        ];


    left =
        pair.left;

    right =
        pair.right;


    document.getElementById(
        "app"
    ).innerHTML = `

    <div class="card">

        <h2>どちらかを選んでください</h2>

        <div class="progress">
            ${battleCount + 1}
            /
            ${totalBattleCount}
        </div>


        <button
            type="button"
            id="leftButton"
            class="choice"
        >
            ${survivors[left].name}
            ${survivors[left].unit}
        </button>


        <div class="vs">
            VS
        </div>


        <button
            type="button"
            id="rightButton"
            class="choice"
        >
            ${survivors[right].name}
            ${survivors[right].unit}
        </button>


        <button
            type="button"
            id="drawButton"
            class="draw"
        >
            引き分け
        </button>

    </div>

    `;

}


/* =========================================
   第2ラウンド終了後
========================================= */

function finalRoundVoteNext(){

    finalRoundIndex++;

    finalBattleNext();

}


/* =========================================
   対戦相手を探す
========================================= */

function findOpponent(){

    const player =
        survivors[left];


    /*
     * 未対戦の相手だけ
     */

    const unplayed =
        survivors.filter(
            (opponent,index) => {

                if(index === left){
                    return false;
                }


                const matchKey =
                    getMatchKey(
                        player,
                        opponent
                    );


                if(
                    playedMatches.has(
                        matchKey
                    )
                ){

                    return false;

                }


                return true;

            }
        );


    /*
     * 未対戦相手なし
     */

    if(
        unplayed.length === 0
    ){

        return -1;

    }


    /*
     * レート差300未満を優先
     */

    const closeOpponents =
        unplayed.filter(
            opponent => {

                const difference =
                    Math.abs(
                        player.rating -
                        opponent.rating
                    );


                return (
                    difference <
                    MAX_RATING_DIFFERENCE
                );

            }
        );


    let available;


    if(
        closeOpponents.length > 0
    ){

        available =
            closeOpponents;

    }else{

        available =
            unplayed;

    }


    /*
     * レート差が近い順
     */

    available.sort(
        (a,b) => {

            const differenceA =
                Math.abs(
                    player.rating -
                    a.rating
                );


            const differenceB =
                Math.abs(
                    player.rating -
                    b.rating
                );


            return (
                differenceA -
                differenceB
            );

        }
    );


    /*
     * 近い候補3人からランダム
     */

    const topCandidates =
        available.slice(
            0,
            Math.min(
                3,
                available.length
            )
        );


    const opponent =
        topCandidates[
            Math.floor(
                Math.random() *
                topCandidates.length
            )
        ];


    return survivors.indexOf(
        opponent
    );

}


/* =========================================
   投票
========================================= */

function vote(result){

    const playerA =
        survivors[left];

    const playerB =
        survivors[right];


    /*
     * 対戦済みとして記録
     */

    const matchKey =
        getMatchKey(
            playerA,
            playerB
        );


    playedMatches.add(
        matchKey
    );


    /*
     * A勝利
     */

    if(
        result === "left"
    ){

        updateElo(
            playerA,
            playerB,
            1,
            0
        );


        playerA.wins++;

        playerB.losses++;

    }


    /*
     * B勝利
     */

    else if(
        result === "right"
    ){

        updateElo(
            playerA,
            playerB,
            0,
            1
        );


        playerA.losses++;

        playerB.wins++;

    }


    /*
     * 引き分け
     */

    else if(
        result === "draw"
    ){

        updateElo(
            playerA,
            playerB,
            0.5,
            0.5
        );


        playerA.draws++;

        playerB.draws++;

    }


    /*
     * 試合数
     */

    playerA.games++;

    playerB.games++;


    battleCount++;


    /*
     * 第2ラウンド中なら
     * 決められた総当たり順で次へ
     */
    if(currentRound === 2){

        finalRoundVoteNext();

        return;
    }


    battleNext();

}


/* =========================================
   Elo更新
========================================= */

function updateElo(
    playerA,
    playerB,
    actualA,
    actualB
){

    const expectedA =
        expectedScore(
            playerA.rating,
            playerB.rating
        );


    const expectedB =
        expectedScore(
            playerB.rating,
            playerA.rating
        );


    const changeA =
        K_FACTOR *
        (
            actualA -
            expectedA
        );


    const changeB =
        K_FACTOR *
        (
            actualB -
            expectedB
        );


    playerA.rating +=
        changeA;


    playerB.rating +=
        changeB;

}


/* =========================================
   結果
========================================= */

function showResult(){

    /*
     * 第2ラウンドの上位12人を
     * 最終レート順に並べる
     */
    const finalRanking =
        [...survivors]
        .sort(
            (a,b) =>
                b.rating -
                a.rating
        );


    /*
     * 13位以降は第1ラウンドの順位をそのまま使用
     */
    const remainingRanking =
        firstRoundRanking.slice(
            finalRanking.length
        );


    /*
     * 初期状態ではトップ10まで
     *
     * 「すべての順位を表示」が
     * 押されたら全員
     */
    const displayRanking =
        showingAllResults
            ? [
                ...finalRanking,
                ...remainingRanking
              ]
            : finalRanking.slice(0,10);


    let html = `

    <div class="card result-card">

        <h2>最終結果</h2>

    `;


    displayRanking.forEach(
        (item,index) => {

            html += `

            <div class="rank-row">

                <span class="result-rank">
                    ${index + 1}位
                </span>

                <span class="result-name">
                    ${item.name}
                    ${item.unit}
                </span>

            </div>

            `;

        }
    );


    /*
     * ボタン
     */

    const totalRankingLength =
        firstRoundRanking.length;


    if(
        !showingAllResults &&
        totalRankingLength > 10
    ){

        html += `

        <button
            type="button"
            id="showAllButton"
            class="secondary"
        >
            すべての順位を表示
        </button>

        `;

    }


    if(
        showingAllResults &&
        totalRankingLength > 10
    ){

        html += `

        <button
            type="button"
            id="showTop10Button"
            class="secondary"
        >
            トップ10を表示
        </button>

        `;

    }


    html += `

        <button
            type="button"
            id="restartButton"
            class="primary"
        >
            もう一度
        </button>

    </div>

    `;


    document.getElementById(
        "app"
    ).innerHTML = html;

}


/* =========================================
   起動
========================================= */

showStart();

</script>
